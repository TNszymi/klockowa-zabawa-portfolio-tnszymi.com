<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klockowa Kraina - Ładowanie...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #111; font-family: 'Press Start 2P', monospace; }

        /* Klocki (tło / baza) */
        #canvas-blocks {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
            background: transparent;
            pointer-events: none;
        }

        /* Przyciski - idealnie wyśrodkowane symetrycznie */
        #buttons-container {
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            background-color: transparent;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease-in;
        }

        #buttons-container.visible { 
            opacity: 1; 
            pointer-events: auto; 
        }

        /* Napis - idealnie wyśrodkowany symetrycznie ponad przyciskami */
        #title-container {
            position: absolute; 
            top: 0; 
            left: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column;
            padding-bottom: 220px;
            z-index: 2;
            background-color: transparent;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease-in;
        }

        #title-container.visible { 
            opacity: 1; 
            pointer-events: auto; 
        }

        h1 {
            color: #fff; text-shadow: 6px 6px #000;
            font-size: 48px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .button-group { display: flex; gap: 60px; flex-wrap: wrap; justify-content: center; }

        .mc-button {
            background-color: #8E8E8E;
            color: #FFFFA0;
            border: 6px solid #000;
            padding: 40px 60px;
            font-family: 'Press Start 2P', monospace; font-size: 28px;
            cursor: pointer; text-decoration: none;
            box-shadow: inset -9px -9px 0px #5F5F5F, inset 9px 9px 0px #CFCFCF;
            text-shadow: 4px 4px #000;
            transition: transform 0.1s, background-color 0.2s;
            position: relative;
            z-index: 20;
        }

        .mc-button:hover {
            background-color: #DEDEDE;
            color: #FFFFFF;
            transform: scale(1.05);
        }

        .mc-button:active {
            box-shadow: inset 9px 9px 0px #5F5F5F, inset -9px -9px 0px #CFCFCF;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Przyciski -->
    <div id="buttons-container">
        <div class="button-group">
            <button id="btn-sala" class="mc-button">PLAC</button>
            <button id="btn-serwer" class="mc-button">SERWER</button>
        </div>
    </div>

    <!-- Płótno z klockami i postaciami -->
    <canvas id="canvas-blocks"></canvas>

    <!-- Napis -->
    <div id="title-container">
        <h1>WITAJ W GRZE</h1>
    </div>

    <script>
        const canvas = document.getElementById('canvas-blocks');
        const ctx = canvas.getContext('2d');
        const buttonsContainer = document.getElementById('buttons-container');
        const titleContainer = document.getElementById('title-container');

        const blockSize = 64; 
        const blockTypes = ['grass', 'stone', 'wood', 'diamond', 'leaves'];

        let columns = [];
        let activeBlocks = [];
        let particles = [];

        let gameState = 'filling';
        let smashCenter = { x: 0, y: 0 };
        let maxSmashRadius = 0;
        let character = null;

        function resizeCanvas() {
            let cols = Math.floor(window.innerWidth / blockSize);
            let rows = Math.floor(window.innerHeight / blockSize);
            
            canvas.width = cols * blockSize;
            canvas.height = rows * blockSize;
            
            initColumns(cols, rows);
        }
        window.addEventListener('resize', resizeCanvas);

        function drawGrassBlock(ctx, x, y, size) {
            const s = size / 16;
            ctx.fillStyle = '#866043'; ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#55953b'; ctx.fillRect(x, y, size, s * 5);
            ctx.fillStyle = '#43752e';
            ctx.fillRect(x + s*2, y + s*5, s*2, s);
            ctx.fillRect(x + s*6, y + s*4, s*2, s*2);
            ctx.fillRect(x + s*10, y + s*5, s*3, s);
            ctx.fillStyle = '#68452a';
            ctx.fillRect(x + s*4, y + s*7, s*2, s*2);
            ctx.fillRect(x + s*12, y + s*9, s*2, s*3);
            ctx.fillRect(x + s*8, y + s*13, s*2, s*2);
        }

        function drawStoneBlock(ctx, x, y, size) {
            const s = size / 16;
            ctx.fillStyle = '#787878'; ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#555555';
            ctx.fillRect(x + s*3, y + s*2, s*4, s*2);
            ctx.fillRect(x + s*10, y + s*8, s*3, s*3);
            ctx.fillRect(x + s*1, y + s*11, s*3, s*2);
            ctx.fillStyle = '#9e9e9e';
            ctx.fillRect(x + s*8, y + s*1, s*3, s*2);
            ctx.fillRect(x + s*2, y + s*7, s*3, s*2);
            ctx.fillRect(x + s*11, y + s*3, s*3, s*2);
        }

        function drawWoodBlock(ctx, x, y, size) {
            const s = size / 16;
            ctx.fillStyle = '#705335'; ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#4a351f';
            for(let i = 0; i < 16; i += 4) { ctx.fillRect(x + s * i, y, s * 2, size); }
            ctx.fillStyle = '#382717';
            ctx.fillRect(x + s*2, y + s*4, s, s*5);
            ctx.fillRect(x + s*10, y + s*8, s, s*6);
            ctx.fillStyle = '#8f6b45';
            ctx.fillRect(x + s*6, y + s*2, s, s*4);
            ctx.fillRect(x + s*14, y + s*10, s, s*3);
        }

        function drawDiamondBlock(ctx, x, y, size) {
            drawStoneBlock(ctx, x, y, size);
            const s = size / 16;
            ctx.fillStyle = '#33ffff';
            ctx.fillRect(x + s*4, y + s*4, s*2, s*2);
            ctx.fillRect(x + s*11, y + s*3, s*2, s*2);
            ctx.fillRect(x + s*7, y + s*10, s*3, s*2);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + s*4, y + s*4, s, s);
            ctx.fillRect(x + s*11, y + s*3, s, s);
            ctx.fillRect(x + s*7, y + s*10, s, s);
        }

        function drawLeavesBlock(ctx, x, y, size) {
            const s = size / 16;
            ctx.fillStyle = '#2e6f1a'; ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#1e4a10';
            for(let py = 0; py < 16; py += 2) {
                for(let px = 0; px < 16; px += 2) {
                    if((px + py) % 4 === 0) { ctx.fillRect(x + s*px, y + s*py, s*2, s*2); }
                }
            }
            ctx.fillStyle = '#3da824';
            ctx.fillRect(x + s*3, y + s*3, s*3, s*3);
            ctx.fillRect(x + s*9, y + s*8, s*4, s*3);
        }

        function drawBlock(ctx, type, x, y, size) {
            const rx = Math.round(x);
            const ry = Math.round(y);
            if (type === 'grass') drawGrassBlock(ctx, rx, ry, size);
            else if (type === 'stone') drawStoneBlock(ctx, rx, ry, size);
            else if (type === 'wood') drawWoodBlock(ctx, rx, ry, size);
            else if (type === 'diamond') drawDiamondBlock(ctx, rx, ry, size);
            else if (type === 'leaves') drawLeavesBlock(ctx, rx, ry, size);
        }

        function drawPixelGrid(ctx, grid, palette, x, y, unit) {
            for (let r = 0; r < grid.length; r++) {
                const row = grid[r];
                for (let c = 0; c < row.length; c++) {
                    const key = row[c];
                    if (!key) continue;
                    ctx.fillStyle = palette[key];
                    ctx.fillRect(Math.round(x + c * unit), Math.round(y + r * unit), unit, unit);
                }
            }
        }

        const STEVE_PALETTE = {
            h: '#4b3220', s: '#cf9169', d: '#a66c48', w: '#ffffff', b: '#3a5fcf', m: '#7a4a2b'
        };
        const STEVE_FACE = [
            ['h','h','h','h','h','h','h','h'],
            ['h','h','h','h','h','h','h','h'],
            ['h','d','s','s','s','s','d','h'],
            ['s','w','b','s','s','b','w','s'],
            ['s','s','s','d','d','s','s','s'],
            ['s','d','s','s','s','s','d','s'],
            ['s','m','m','m','m','m','m','s'],
            ['d','s','m','m','m','m','s','d']
        ];

        function drawShadedRect(ctx, x, y, w, h, dark, mid, light) {
            const third = w / 3;
            ctx.fillStyle = dark;  ctx.fillRect(x, y, third, h);
            ctx.fillStyle = mid;   ctx.fillRect(x + third, y, third, h);
            ctx.fillStyle = light; ctx.fillRect(x + third * 2, y, w - third * 2, h);
        }

        function drawSteve(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.imageSmoothingEnabled = false;

            const shirt = '#1bb0b0', shirtDark = '#158e8e', shirtLight = '#3fd0d0';
            const skin = '#cf9169', skinDark = '#a66c48';
            const pantsL = '#3c3c8c', pantsR = '#3c3c8c', pantsShade = '#2c2c6e';
            const boot = '#3a3a3a', bootDark = '#222222';

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 33, 22, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Lewa ręka
            ctx.fillStyle = skin; ctx.fillRect(-22, -22, 6, 22);
            ctx.fillStyle = skinDark; ctx.fillRect(-22, -22, 2, 22);
            ctx.fillStyle = shirt; ctx.fillRect(-22, -32, 6, 11);
            ctx.fillStyle = shirtDark; ctx.fillRect(-22, -32, 2, 11);

            // Nogi
            ctx.fillStyle = pantsL; ctx.fillRect(-11, 0, 10, 26);
            ctx.fillStyle = pantsShade; ctx.fillRect(-11, 0, 3, 26);
            ctx.fillStyle = pantsR; ctx.fillRect(1, 0, 10, 26);
            ctx.fillStyle = pantsShade; ctx.fillRect(8, 0, 3, 26);
            ctx.fillStyle = boot; ctx.fillRect(-11, 26, 10, 6);
            ctx.fillStyle = bootDark; ctx.fillRect(-11, 30, 10, 2);
            ctx.fillStyle = boot; ctx.fillRect(1, 26, 10, 6);
            ctx.fillStyle = bootDark; ctx.fillRect(1, 30, 10, 2);

            // Tułów
            ctx.fillStyle = shirt; ctx.fillRect(-16, -32, 32, 32);
            ctx.fillStyle = shirtLight; ctx.fillRect(-16, -32, 6, 32);
            ctx.fillStyle = shirtDark; ctx.fillRect(10, -32, 6, 32);
            ctx.fillStyle = shirtDark; ctx.fillRect(-16, -6, 32, 6);

            // Głowa
            ctx.fillStyle = skin; ctx.fillRect(-16, -64, 32, 32);
            drawPixelGrid(ctx, STEVE_FACE, STEVE_PALETTE, -16, -64, 4);
            ctx.fillStyle = skinDark; ctx.fillRect(12, -64, 4, 32);

            // Prawa ręka
            ctx.fillStyle = shirt; ctx.fillRect(16, -32, 6, 11);
            ctx.fillStyle = shirtLight; ctx.fillRect(20, -32, 2, 11);
            ctx.fillStyle = skin; ctx.fillRect(16, -22, 6, 22);
            ctx.fillStyle = skinDark; ctx.fillRect(20, -22, 2, 22);

            ctx.restore();
        }

        function drawEnderman(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.imageSmoothingEnabled = false;

            const dark = '#0b0b0f';
            const mid = '#14141a';
            const light = '#1e1e26';
            const t = Date.now() * 0.001;

            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 2, 22, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 7; i++) {
                const seed = i * 33.5;
                const orbit = 35 + 12 * Math.sin(t * 0.8 + seed);
                const angle = t * 1.1 + seed;
                const px = Math.cos(angle) * orbit;
                const py = -80 + Math.sin(angle * 1.2 + seed) * 70 - ((t * 8 + i * 10) % 60);
                const alpha = 0.2 + 0.2 * Math.sin(t * 3 + seed);
                ctx.fillStyle = i % 2 === 0 ? `rgba(160,32,240,${Math.max(0, alpha)})` : `rgba(20,20,30,${Math.max(0, alpha)})`;
                ctx.fillRect(px - 1.5, py - 1.5, 3, 3);
            }

            const legH = 105;
            const legW = 6;
            drawShadedRect(ctx, -8, -legH, legW, legH, dark, mid, light);
            drawShadedRect(ctx, 2, -legH, legW, legH, dark, mid, light);

            const torsoH = 70;
            const torsoW = 16;
            drawShadedRect(ctx, -torsoW / 2, -legH - torsoH, torsoW, torsoH, dark, mid, light);

            const headH = 26;
            const headW = 26;
            const headTop = -legH - torsoH - 8 - headH;
            drawShadedRect(ctx, -headW / 2, headTop, headW, headH, dark, mid, light);

            const eyeY = headTop + 10;
            const pulse = 0.8 + 0.2 * Math.sin(t * 4);
            
            ctx.fillStyle = '#b01eff';
            ctx.fillRect(-8, eyeY, 6, 2);
            ctx.fillStyle = `rgba(240, 200, 255, ${pulse})`;
            ctx.fillRect(-7, eyeY, 4, 1);

            ctx.fillStyle = '#b01eff';
            ctx.fillRect(2, eyeY, 6, 2);
            ctx.fillStyle = `rgba(240, 200, 255, ${pulse})`;
            ctx.fillRect(3, eyeY, 4, 1);

            ctx.fillStyle = dark;
            ctx.fillRect(-18, -legH - torsoH + 4, 4, 75);
            ctx.fillRect(-24, -legH - torsoH + 70, 10, 4);

            ctx.fillRect(14, -legH - torsoH + 4, 4, 75);
            ctx.fillRect(14, -legH - torsoH + 70, 10, 4);

            ctx.save();
            ctx.translate(-16, -legH - torsoH + 50);
            drawGrassBlock(ctx, 0, 0, 32);
            ctx.restore();

            ctx.restore();
        }

        function initColumns(totalCols, totalRows) {
            columns = [];
            activeBlocks = [];
            particles = [];
            gameState = 'filling';
            character = null;
            buttonsContainer.classList.remove('visible');
            titleContainer.classList.remove('visible');
            
            for (let i = 0; i < totalCols; i++) {
                columns.push({
                    x: i * blockSize,
                    currentHeight: 0,
                    maxHeight: totalRows,
                    activeBlock: null,
                    settledBlocks: []
                });
            }
        }
        
        resizeCanvas();

        function spawnBlockForColumn(col) {
            if (col.currentHeight >= col.maxHeight) return null;
            return {
                x: col.x,
                y: -blockSize * 2,
                targetY: canvas.height - (col.currentHeight + 1) * blockSize,
                speed: 16,
                type: blockTypes[Math.floor(Math.random() * blockTypes.length)],
                settled: false
            };
        }

        function spawnParticles(x, y, count) {
            const palette = ['#866043', '#55953b', '#787878', '#9e9e9e', '#705335', '#4a351f', '#33ffff', '#2e6f1a'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + Math.random() * blockSize,
                    y: y + Math.random() * blockSize,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -Math.random() * 6 - 1,
                    size: 5 + Math.random() * 5,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    gravity: 0.2,
                    alpha: 1.0
                });
            }
        }

        function updateParticles() {
            particles.forEach(p => {
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;
            });
            particles = particles.filter(p => p.alpha > 0);
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            });
            ctx.globalAlpha = 1.0;
        }

        function smashBlocksAt(cx, cy, radius) {
            columns.forEach(col => {
                col.settledBlocks = col.settledBlocks.filter(sb => {
                    const bx = sb.x + blockSize / 2;
                    const by = sb.y + blockSize / 2;
                    const dist = Math.hypot(bx - cx, by - cy);
                    if (dist <= radius) {
                        spawnParticles(sb.x, sb.y, 4);
                        return false;
                    }
                    return true;
                });
            });
        }

        function startDigSequence() {
            gameState = 'ready';
            smashCenter = { x: canvas.width / 2, y: canvas.height / 2 };
            maxSmashRadius = Math.hypot(canvas.width, canvas.height) / 2 + blockSize;
            
            smashBlocksAt(smashCenter.x, smashCenter.y, maxSmashRadius);
            buttonsContainer.classList.add('visible');
            titleContainer.classList.add('visible');
        }

        function getButtonTarget(btnId) {
            const btn = document.getElementById(btnId);
            const rect = btn.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height
            };
        }

        document.getElementById('btn-sala').addEventListener('click', () => {
            if (character) return;
            buttonsContainer.classList.remove('visible');
            titleContainer.classList.remove('visible');
            
            const target = getButtonTarget('btn-sala');

            character = {
                type: 'steve',
                x: target.x,
                y: -150,
                targetX: target.x,
                targetY: target.y,
                vy: 0,
                callback: () => { window.location.href = 'plac.html'; }
            };
        });

        document.getElementById('btn-serwer').addEventListener('click', () => {
            if (character) return;
            buttonsContainer.classList.remove('visible');
            titleContainer.classList.remove('visible');
            
            const target = getButtonTarget('btn-serwer');

            character = {
                type: 'enderman',
                x: target.x,
                y: -150,
                targetX: target.x,
                targetY: target.y,
                vy: 0,
                callback: () => { window.location.href = 'serwer.html'; }
            };
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'filling') {
                let shuffledColumns = [...columns].sort(() => Math.random() - 0.5);

                shuffledColumns.forEach(col => {
                    if (!col.activeBlock && col.currentHeight < col.maxHeight) {
                        if (Math.random() < 0.5) {
                            col.activeBlock = spawnBlockForColumn(col);
                            if (col.activeBlock) {
                                activeBlocks.push(col.activeBlock);
                            }
                        }
                    }
                });

                activeBlocks.forEach(block => {
                    if (!block.settled) {
                        block.y += block.speed;
                        if (block.y >= block.targetY) {
                            block.y = block.targetY;
                            block.settled = true;
                            let col = columns.find(c => c.x === block.x);
                            if (col) {
                                col.currentHeight++;
                                col.settledBlocks.push({ type: block.type, x: block.x, y: block.y });
                                col.activeBlock = null;
                            }
                        }
                    }
                });

                activeBlocks = activeBlocks.filter(b => !b.settled);

                let allDone = columns.every(c => c.currentHeight >= c.maxHeight);
                if (allDone) {
                    startDigSequence();
                }
            }

            columns.forEach(col => {
                col.settledBlocks.forEach(sb => {
                    drawBlock(ctx, sb.type, sb.x, sb.y, blockSize);
                });
            });

            activeBlocks.forEach(block => {
                if (!block.settled) {
                    drawBlock(ctx, block.type, block.x, block.y, blockSize);
                }
            });

            updateParticles();
            drawParticles();

            if (character) {
                character.y += character.vy;
                character.vy += 0.8;

                if (character.y >= character.targetY) {
                    character.y = character.targetY;
                    setTimeout(() => {
                        character.callback();
                    }, 250);
                    const cb = character.callback;
                    character = { ...character, callback: () => {} };
                    setTimeout(cb, 250);
                }

                if (character.type === 'steve') {
                    drawSteve(ctx, character.x, character.y, 3.2);
                } else {
                    drawEnderman(ctx, character.x, character.y, 2.2);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
